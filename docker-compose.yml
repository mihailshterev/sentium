name: sentium

x-extra-hosts: &extra-hosts
  - "host.docker.internal:host-gateway"

x-service-env: &service-env
  ASPNETCORE_ENVIRONMENT: Development
  InternalApi__ApiKey: ${INTERNAL_API_KEY}
  services__sentium-web__http__0: http://sentium-web:8080
  services__sandbox__http__0: http://sandbox:8080

# llama.cpp's llama-server, build b11804 pinned by digest (CPU image; docker-compose.gpu.yml swaps in the
# CUDA image). The image listens on 0.0.0.0:8080 and only answers requests carrying LLM_API_KEY, except
# /health. Model files come from the verified models volume, read-only.
x-llama-server: &llama-server
  image: ghcr.io/ggml-org/llama.cpp:server-b11804@sha256:8c74db29f1a2bef3f0a331b52c4d6214601dfceed4bee0b94cc48b3b23ff257d
  environment:
    LLAMA_API_KEY: ${LLM_API_KEY}
  depends_on:
    models-init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sentiumdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sentiumdb"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: ["azurite", "--blobHost", "0.0.0.0", "--queueHost", "0.0.0.0", "--tableHost", "0.0.0.0", "-l", "/data"]
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data
    restart: unless-stopped

  # One-shot: downloads the model files pinned in infra/llm/models.lock and verifies their SHA-256
  # (skips files already present). Exits non-zero on a checksum mismatch, which keeps the servers down.
  models-init:
    image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    user: "0:0"
    entrypoint: ["sh", "/infra/fetch-models.sh"]
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./infra/llm:/infra:ro
      - llm-models:/models
    restart: "no"

  # Chat models: llama-server in router mode, serving the presets in infra/llm/models.ini.
  llm:
    <<: *llama-server
    command: ["--no-webui", "--metrics", "--models-preset", "/infra/models.ini", "--models-max", "2"]
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - llm-models:/models:ro
      - ./infra/llm:/infra:ro
    healthcheck:
      # The router's /health is up before its models finish loading; ready = a chat model is "loaded".
      test:
        [
          "CMD-SHELL",
          'curl -fsS -H "Authorization: Bearer $$LLAMA_API_KEY" http://localhost:8080/models | grep -q ''"value":"loaded"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Embeddings: a dedicated llama-server for the RAG embedding model (768 dimensions).
  embeddings:
    <<: *llama-server
    command:
      - --no-webui
      - --metrics
      - --model=/models/embeddinggemma-2-Q8_0.gguf
      - --embeddings
      - --ctx-size=8192
      - --batch-size=2048
      - --ubatch-size=2048
      - --parallel=4
    ports:
      - "127.0.0.1:8091:8080"
    volumes:
      - llm-models:/models:ro
    healthcheck:
      # /health answers 503 until the model is loaded.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

  searxng:
    image: searxng/searxng@sha256:7add5ffe7933e6b46aa3a26bed8a0c342c9a45ec331d9a8cf145e46b04b24f36
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env (see .env.example)}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - default
      - sentium-egress
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # The modular monolith: every module (Identity, Registry, Sentinel, Codex, Praxis, Vigil) in one
  # process. It serves the portal and the API from one HTTPS origin (the auth
  # cookie is Secure).
  sentium-web:
    build:
      context: .
      dockerfile: src/hosts/Sentium.Web/Dockerfile
    extra_hosts: *extra-hosts
    environment:
      <<: *service-env
      ConnectionStrings__sentiumdb: Host=postgres;Port=5432;Database=sentiumdb;Username=postgres;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__postgres: Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__redis: redis:6379
      ConnectionStrings__workspace-storage: ${AZURITE_CONNECTION}
      Inference__ChatEndpoint: http://llm:8080
      Inference__EmbeddingEndpoint: http://embeddings:8080
      Inference__ApiKey: ${LLM_API_KEY}
      Inference__DefaultModel: ${SENTIUM_MODEL:-gemma-4-e4b}
      Rag__EmbeddingModelName: ${SENTIUM_EMBEDDING_MODEL:-embeddinggemma-2}
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/sentium.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${CERT_PASSWORD}
      DataProtection__KeysPath: /keys
    ports:
      - "${WEB_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./certs:/https:ro
      - web-dataprotection:/keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      azurite:
        condition: service_started
      llm:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    restart: unless-stopped

  # Runs agent-written code in throwaway Docker containers. Kept out of the web process on purpose
  # (it owns the Docker socket); stateless, reachable only from sentium-web with the internal API key.
  sandbox:
    build:
      context: .
      dockerfile: src/hosts/Sentium.Sandbox/Dockerfile
    extra_hosts: *extra-hosts
    environment:
      <<: *service-env
      ConnectionStrings__workspace-storage: ${AZURITE_CONNECTION}
      DOCKER_HOST: unix:///var/run/docker.sock
      Sandbox__DockerHost: unix:///var/run/docker.sock
      Sandbox__JobBaseDirectory: ${SANDBOX_JOBS_DIR:-/tmp/sentium-sandbox}
      Sandbox__Mcp__Enabled: ${SANDBOX_MCP_ENABLED:-false}
      Sandbox__Mcp__AllowedNetworks__0: ${SANDBOX_MCP_ALLOWED_NETWORK:-sentium-egress}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SANDBOX_JOBS_DIR:-/tmp/sentium-sandbox}:${SANDBOX_JOBS_DIR:-/tmp/sentium-sandbox}
    depends_on:
      azurite:
        condition: service_started
      sentium-web:
        condition: service_started
    restart: unless-stopped

networks:
  # Sandbox MCP containers may join this network (SANDBOX_MCP_ALLOWED_NETWORK). `internal: true` means no route to the
  # internet; only services also attached to it (searxng) are reachable. The explicit name keeps compose from
  # prefixing it with the project name - the Sandbox matches the allowed network by exact name.
  sentium-egress:
    name: sentium-egress
    internal: true

volumes:
  postgres-data:
  redis-data:
  azurite-data:
  web-dataprotection:
  # Verified model files, shared with the Aspire AppHost so they download once.
  llm-models:
    name: sentium-llm-models
