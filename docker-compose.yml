name: sentium

x-extra-hosts: &extra-hosts
  - "host.docker.internal:host-gateway"

x-service-env: &service-env
  ASPNETCORE_ENVIRONMENT: Development
  InternalApi__ApiKey: ${INTERNAL_API_KEY}
  services__sentium-web__http__0: http://sentium-web:8080
  services__sandbox__http__0: http://sandbox:8080

services:
  postgres:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sentiumdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sentiumdb"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: ["azurite", "--blobHost", "0.0.0.0", "--queueHost", "0.0.0.0", "--tableHost", "0.0.0.0", "-l", "/data"]
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.6
    environment:
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_NUM_PARALLEL: "2"
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_CONTEXT_LENGTH: "16384"
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    # GPU (NVIDIA): uncomment to enable - see docs/installation.md
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama-init:
    image: ollama/ollama:0.40.6
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        echo 'Waiting for Ollama...';
        until ollama list >/dev/null 2>&1; do sleep 2; done;
        for model in "${SENTIUM_MODEL}" "${SENTIUM_EMBEDDING_MODEL}"; do
          echo "Pulling $$model...";
          until ollama pull "$$model"; do echo "Pull of $$model failed; retrying in 5s..."; sleep 5; done;
        done;
        echo 'All models ready.'
    restart: "no"

  # The modular monolith: every module (Identity, Registry, Sentinel, Codex, Praxis, Vigil) in one
  # process. It serves the portal and the API from one HTTPS origin (the auth
  # cookie is Secure).
  sentium-web:
    build:
      context: .
      dockerfile: src/hosts/Sentium.Web/Dockerfile
    extra_hosts: *extra-hosts
    environment:
      <<: *service-env
      ConnectionStrings__sentiumdb: Host=postgres;Port=5432;Database=sentiumdb;Username=postgres;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__postgres: Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__redis: redis:6379
      ConnectionStrings__workspace-storage: ${AZURITE_CONNECTION}
      ConnectionStrings__ollama: http://ollama:11434
      Inference__ChatEndpoint: http://ollama:11434
      Inference__EmbeddingEndpoint: http://ollama:11434
      Inference__DefaultModel: ${SENTIUM_MODEL}
      Rag__EmbeddingModelName: ${SENTIUM_EMBEDDING_MODEL}
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/sentium.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${CERT_PASSWORD}
    ports:
      - "${WEB_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./certs:/https:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      azurite:
        condition: service_started
      ollama:
        condition: service_healthy
    restart: unless-stopped

  # Runs agent-written code in throwaway Docker containers. Kept out of the web process on purpose
  # (it owns the Docker socket); stateless, reachable only from sentium-web with the internal API key.
  sandbox:
    build:
      context: .
      dockerfile: src/hosts/Sentium.Sandbox/Dockerfile
    extra_hosts: *extra-hosts
    environment:
      <<: *service-env
      ConnectionStrings__workspace-storage: ${AZURITE_CONNECTION}
      DOCKER_HOST: unix:///var/run/docker.sock
      Sandbox__DockerHost: unix:///var/run/docker.sock
      Sandbox__JobBaseDirectory: ${SANDBOX_JOBS_DIR:-/tmp/sentium-sandbox}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SANDBOX_JOBS_DIR:-/tmp/sentium-sandbox}:${SANDBOX_JOBS_DIR:-/tmp/sentium-sandbox}
    depends_on:
      azurite:
        condition: service_started
      sentium-web:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  azurite-data:
  ollama-data:
