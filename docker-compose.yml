name: sentium

# Docker's default json-file log driver never rotates its files, so every container is capped at LOG_MAX_FILE files
# of LOG_MAX_SIZE each (30 MB by default); `docker compose logs` still shows them.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}

x-extra-hosts: &extra-hosts
  - "host.docker.internal:host-gateway"

x-service-env: &service-env
  ASPNETCORE_ENVIRONMENT: Production
  InternalApi__ApiKey: ${INTERNAL_API_KEY}
  services__sentium-web__http__0: http://sentium-web:8080
  services__sandbox__http__0: http://sandbox:8080

# llama.cpp's llama-server, build b11804 pinned by digest (CPU image; docker-compose.gpu.yml swaps in the
# CUDA image). The image listens on 0.0.0.0:8080 and only answers requests carrying LLM_API_KEY, except
# /health. Model files come from the verified models volume, read-only.
x-llama-server: &llama-server
  image: ghcr.io/ggml-org/llama.cpp:server-b11804@sha256:8c74db29f1a2bef3f0a331b52c4d6214601dfceed4bee0b94cc48b3b23ff257d
  environment:
    LLAMA_API_KEY: ${LLM_API_KEY}
  depends_on:
    models-init:
      condition: service_completed_successfully
  restart: unless-stopped

# S3 connection string for the object store (see the storage service). sentium-web, the sandbox and the backup
# sidecar all use it; the keys must not contain ";".
x-storage-connection: &storage-connection Endpoint=http://storage:8333;AccessKey=${STORAGE_ACCESS_KEY};SecretKey=${STORAGE_SECRET_KEY}

# The backup sidecar (see "Backups" in docs/installation.md). Shared by the nightly service and the one-shot restore.
x-backup: &backup
  image: sentium-backup:local
  build:
    context: .
    dockerfile: src/hosts/Sentium.Backup/Dockerfile
  environment: &backup-env
    <<: *service-env
    PGHOST: postgres
    PGUSER: postgres
    PGPASSWORD: ${POSTGRES_PASSWORD}
    PGDATABASE: sentiumdb
    ConnectionStrings__workspace-storage: *storage-connection
    Backup__TimeOfDay: ${BACKUP_TIME:-03:00}
    Backup__KeepDaily: ${BACKUP_KEEP_DAILY:-7}
    Backup__KeepWeekly: ${BACKUP_KEEP_WEEKLY:-4}
    Backup__RecipientPublicKey: ${BACKUP_AGE_RECIPIENT:-}
    TZ: ${BACKUP_TIMEZONE:-UTC}
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
  security_opt:
    - no-new-privileges:true
  networks:
    - sentium-backup
    - sentium-storage

services:
  postgres:
    logging: *default-logging
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sentiumdb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - default
      - sentium-backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sentiumdb"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # One-shot, before every start of sentium-web: creates (or updates) the sentium_app role sentium-web connects as and
  # hands it every Sentium schema - on a fresh install, on one that predates the role, and after a restore. See
  # infra/postgres/app-role.sql. Uses the postgres image only for psql.
  db-init:
    logging: *default-logging
    image: pgvector/pgvector:pg18-trixie
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: sentiumdb
      APP_DB_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env (see .env.example)}
    entrypoint: ["sh", "-c", 'psql --no-psqlrc -v app_password="$$APP_DB_PASSWORD" -f /init/app-role.sql']
    volumes:
      - ./infra/postgres:/init:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # S3-compatible object storage, pinned by digest: workspace files, sandbox artifacts and inventory attachments.
  # Only the S3 API is authenticated, so the store sits alone on the internal sentium-storage network with no
  # published port; telemetry and every other front end are off. The entrypoint drops to an unprivileged user,
  # hence the CHOWN/SETUID/SETGID capabilities.
  storage:
    logging: *default-logging
    image: chrislusf/seaweedfs:4.54@sha256:4b42c212543a0acd4c0e675215ecdcaf62a186ef98def76c7e12701871222d15
    command:
      - mini
      - -dir=/data
      - -ip=127.0.0.1
      - -ip.bind=0.0.0.0
      - -master.telemetry=false
      - -admin.ui=false
      - -webdav=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:?Set STORAGE_ACCESS_KEY in .env (see .env.example)}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY in .env (see .env.example)}
    volumes:
      - storage-data:/data
    networks:
      - sentium-storage
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # One-shot: downloads the model files pinned in infra/llm/models.lock and verifies their SHA-256
  # (skips files already present). Exits non-zero on a checksum mismatch, which keeps the servers down.
  models-init:
    logging: *default-logging
    image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    user: "0:0"
    entrypoint: ["sh", "/infra/fetch-models.sh"]
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./infra/llm:/infra:ro
      - llm-models:/models
    restart: "no"

  # Chat models: llama-server in router mode, serving the presets in infra/llm/models.ini.
  llm:
    logging: *default-logging
    <<: *llama-server
    command: ["--no-webui", "--metrics", "--models-preset", "/infra/models.ini", "--models-max", "2"]
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - llm-models:/models:ro
      - ./infra/llm:/infra:ro
    healthcheck:
      # The router's /health is up before its models finish loading; ready = a chat model is "loaded".
      test:
        [
          "CMD-SHELL",
          'curl -fsS -H "Authorization: Bearer $$LLAMA_API_KEY" http://localhost:8080/models | grep -q ''"value":"loaded"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Embeddings: a dedicated llama-server for the RAG embedding model (768 dimensions).
  embeddings:
    logging: *default-logging
    <<: *llama-server
    command:
      - --no-webui
      - --metrics
      - --model=/models/embeddinggemma-2-Q8_0.gguf
      - --embeddings
      - --ctx-size=8192
      - --batch-size=2048
      - --ubatch-size=2048
      - --parallel=4
    ports:
      - "127.0.0.1:8091:8080"
    volumes:
      - llm-models:/models:ro
    healthcheck:
      # /health answers 503 until the model is loaded.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

  # Speech-to-text for push-to-talk: whisper.cpp's server on the CPU, pinned by digest. It reads the Whisper
  # model from the verified models volume and converts browser recordings (WebM/Opus, MP4/AAC) with ffmpeg.
  # No published port: only sentium-web talks to it. Optional - see SPEECH_TRANSCRIPTION_ENDPOINT in .env.example.
  whisper:
    logging: *default-logging
    image: ghcr.io/ggml-org/whisper.cpp:main-1fe009caeda75f69bc864d6370b10674e45a92bd@sha256:77926a46acc8aafab4af8fa932daf8a2df22151954257e18b6a38911ed9f02fc
    entrypoint: ["/app/build/bin/whisper-server"]
    # whisper-server only accepts "--flag value" (not "--flag=value"), so every value is its own argument.
    command: [
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
        "--model",
        "/models/ggml-base.en.bin",
        "--inference-path",
        "/v1/audio/transcriptions",
        "--convert",
        "--tmp-dir",
        "/tmp",
        "--no-timestamps",
        # Voice activity detection: a recording without speech transcribes to nothing instead of an invented word.
        "--vad",
        "--vad-model",
        "/models/ggml-silero-v6.2.0.bin",
      ]
    volumes:
      - llm-models:/models:ro
    depends_on:
      models-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # Text-to-speech for spoken replies: Kokoro on the CPU. The model and voices are part of the image, so the
  # digest pins them and nothing is downloaded at run time. No published port.
  tts:
    logging: *default-logging
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.10.0@sha256:f54c5960c2b9387f6349080a9944f8bc7e8cdb98a4ef9238cb0b0f9ff9795f44
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8880/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    restart: unless-stopped

  searxng:
    logging: *default-logging
    image: searxng/searxng@sha256:7add5ffe7933e6b46aa3a26bed8a0c342c9a45ec331d9a8cf145e46b04b24f36
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env (see .env.example)}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - default
      - sentium-egress
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  caddy:
    logging: *default-logging
    image: caddy:2.10.2-alpine
    environment:
      SENTIUM_HOSTNAME: ${SENTIUM_HOSTNAME:-sentium.home.arpa}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      sentium-web:
        condition: service_started
    restart: unless-stopped

  # The modular monolith: every module in one process, as an unprivileged user with no capabilities. It serves the
  # portal and the API from one origin, over plain HTTP on the internal network only; caddy is its sole public entry.
  # Forwarded headers make requests read as HTTPS from the client's address.
  sentium-web:
    logging: *default-logging
    build:
      context: .
      dockerfile: src/hosts/Sentium.Web/Dockerfile
    extra_hosts: *extra-hosts
    environment:
      <<: *service-env
      # Not the superuser: see db-init.
      ConnectionStrings__sentiumdb: Host=postgres;Port=5432;Database=sentiumdb;Username=sentium_app;Password=${POSTGRES_APP_PASSWORD}
      ConnectionStrings__workspace-storage: *storage-connection
      Inference__ChatEndpoint: http://llm:8080
      Inference__EmbeddingEndpoint: http://embeddings:8080
      Inference__ApiKey: ${LLM_API_KEY}
      Inference__DefaultModel: ${SENTIUM_MODEL:-gemma-4-e4b}
      Rag__EmbeddingModelName: ${SENTIUM_EMBEDDING_MODEL:-embeddinggemma-2}
      # "-" (not ":-"): an empty value in .env switches that half of speech off.
      Speech__TranscriptionEndpoint: ${SPEECH_TRANSCRIPTION_ENDPOINT-http://whisper:8080}
      Speech__SynthesisEndpoint: ${SPEECH_SYNTHESIS_ENDPOINT-http://tts:8880}
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      DataProtection__KeysPath: /keys
      # "-" (not ":-"): an empty value in .env turns the Backups panel and the Vigil backup probe off.
      Backup__Endpoint: ${BACKUP_ENDPOINT-http://backup:8080}
    volumes:
      - web-dataprotection:/keys
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - sentium-sandbox
      - sentium-backup
      - sentium-storage
    # The models are not waited for: the portal, inventory and timeline work while a model loads (or fails to), and
    # Vigil reports the inference servers' state.
    depends_on:
      db-init:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
      llm:
        condition: service_started
      embeddings:
        condition: service_started
    restart: unless-stopped

  # Runs agent-written code in throwaway Docker containers. Kept out of the web process on purpose
  # (it owns the Docker socket); stateless. Only on sentium-sandbox, so only sentium-web can call it (with the
  # internal API key), and it calls nothing back: Sentinel authorizes each run inside sentium-web beforehand.
  sandbox:
    logging: *default-logging
    build:
      context: .
      dockerfile: src/hosts/Sentium.Sandbox/Dockerfile
    extra_hosts: *extra-hosts
    environment:
      <<: *service-env
      ConnectionStrings__workspace-storage: *storage-connection
      DOCKER_HOST: unix:///var/run/docker.sock
      Sandbox__DockerHost: unix:///var/run/docker.sock
      Sandbox__JobBaseDirectory: ${SANDBOX_JOBS_DIR:-/tmp/sentium-sandbox}
      Sandbox__Mcp__Enabled: ${SANDBOX_MCP_ENABLED:-false}
      Sandbox__Mcp__AllowedNetworks__0: ${SANDBOX_MCP_ALLOWED_NETWORK:-sentium-egress}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SANDBOX_JOBS_DIR:-/tmp/sentium-sandbox}:${SANDBOX_JOBS_DIR:-/tmp/sentium-sandbox}
    networks:
      - sentium-sandbox
      - sentium-storage
    depends_on:
      storage:
        condition: service_healthy
    restart: unless-stopped

  # Nightly backups of the database, blobs and data-protection keys to BACKUP_DESTINATION. It is the only service
  # with the database superuser's credentials; Vigil reads its status and "back up now" calls it, both with the
  # internal API key. It keeps running while sentium-web is down. Only on sentium-backup (see x-backup).
  backup:
    logging: *default-logging
    <<: *backup
    volumes:
      - ${BACKUP_DESTINATION:-./backups}:/backups
      - web-dataprotection:/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
    restart: unless-stopped

  # One-shot restore, run only by infra/backup/restore.sh while the application containers are stopped.
  backup-restore:
    logging: *default-logging
    <<: *backup
    profiles: ["restore"]
    volumes:
      - ${BACKUP_DESTINATION:-./backups}:/backups:ro
      - web-dataprotection:/keys
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
    restart: "no"

networks:
  # Internal networks (`internal: true`: no route to the internet) that keep the two privileged sidecars and the
  # object store away from every other container. sentium-sandbox: sentium-web calls the Sandbox.
  # sentium-backup: sentium-web calls the Backup service, which reads postgres. sentium-storage: only sentium-web, the
  # Sandbox (artifacts) and the Backup service reach the object store.
  sentium-sandbox:
    internal: true
  sentium-backup:
    internal: true
  sentium-storage:
    internal: true

  # Sandbox MCP containers may join this network (SANDBOX_MCP_ALLOWED_NETWORK). `internal: true` means no route to the
  # internet; only services also attached to it (searxng) are reachable. The explicit name keeps compose from
  # prefixing it with the project name - the Sandbox matches the allowed network by exact name.
  sentium-egress:
    name: sentium-egress
    internal: true

volumes:
  postgres-data:
  # Object storage. Back it up through the backup service, not by copying the volume.
  storage-data:
  web-dataprotection:
  # Caddy's CA (root and intermediate keys) and issued certificates. Deleting it creates a new CA, which every
  # device then has to trust again.
  caddy-data:
  caddy-config:
  # Verified model files, shared with the Aspire AppHost so they download once.
  llm-models:
    name: sentium-llm-models
