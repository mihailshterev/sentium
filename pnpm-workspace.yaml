packages:
  - src/clients/sentium-portal
  - e2e

# Supply-chain guards for every JS project in the repo.
# Only resolve versions published at least 7 days ago (minutes)
minimumReleaseAge: 10080
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 129600

# Every direct dependency version lives in the catalog below; package.json files reference it with "catalog:".
# Strict mode rejects a direct dependency that bypasses the catalog.
catalogMode: strict

catalog:
  # Shared
  "@types/node": 24.12.0
  typescript: 5.9.3

  # Portal runtime
  "@dnd-kit/core": 6.3.1
  "@dnd-kit/sortable": 10.0.0
  "@dnd-kit/utilities": 3.2.2
  "@tanstack/react-query": 5.96.2
  d3-force: 3.0.0
  lucide-react: 1.7.0
  react: 19.3.0
  react-dom: 19.3.0
  react-hook-form: 7.75.0
  react-router: 8.4.0
  zod: 4.6.7

  # Portal tooling
  "@eslint/js": 9.39.4
  "@testing-library/jest-dom": 6.9.1
  "@testing-library/react": 16.3.2
  "@testing-library/user-event": 14.6.1
  "@types/d3-force": 3.0.10
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.2
  "@vitest/coverage-v8": 5.1.0
  eslint: 10.3.0
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-react-refresh: 0.5.7
  globals: 17.4.0
  jsdom: 30.1.1
  # Optional peer of @vitejs/plugin-react, needed for `compiler: true` in vite.config.ts.
  oxc-transform-react: 0.154.0
  typescript-eslint: 8.59.4
  vite: 8.3.4
  vitest: 5.1.0

  # E2E
  "@playwright/test": 1.64.1

# Security floors for vulnerable transitive versions.
overrides:
  "minimatch": ">=11.0.1"
  "minimatch@>=5>brace-expansion": ">=5.0.7"
  "undici@>=8.0.0 <8.12.2": "8.12.2"
  baseline-browser-mapping@>=2.0.0 <2.11.0: 2.11.0
  browserslist@<=4.28.6: 4.28.7
  source-map-js@>=1.0.0 <1.2.2: 1.2.2
