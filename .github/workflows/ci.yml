name: Sentium.CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "scripts/**"
      - ".vscode/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "scripts/**"
      - ".vscode/**"
      - "LICENSE"
  # Runs every job, Satelles on all platforms, and E2E on the chosen browsers.
  workflow_dispatch:
    inputs:
      browser:
        description: "E2E browser to run"
        type: choice
        options: [all, chromium, firefox, webkit]
        default: all

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "24"
  BUILD_CONFIGURATION: "Release"

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dotnet: ${{ steps.changes.outputs.dotnet }}
      portal: ${{ steps.changes.outputs.portal }}
      satelles: ${{ steps.changes.outputs.satelles }}
      e2e: ${{ steps.changes.outputs.e2e }}
      draft: ${{ steps.changes.outputs.draft }}
      satelles-os: ${{ steps.satelles-os.outputs.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: .github

      - id: changes
        uses: $/.github/actions/changes

      - id: satelles-os
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["windows-latest","macos-latest","ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  dotnet-build-test:
    name: .NET Build & Test
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore --configuration ${{ env.BUILD_CONFIGURATION }}

      - name: Run Tests
        run: dotnet test --no-build --configuration ${{ env.BUILD_CONFIGURATION }} --verbosity normal

  satelles-build:
    name: Sentium Satelles (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.satelles == 'true' && needs.changes.outputs.draft != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.satelles-os) }}
    defaults:
      run:
        working-directory: ./src/clients/sentium-satelles
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev patchelf

      - name: Install Rust
        # Installs the toolchain pinned in src-tauri/rust-toolchain.toml.
        working-directory: ./src/clients/sentium-satelles/src-tauri
        run: rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/clients/sentium-satelles/src-tauri/target
          key: satelles-${{ runner.os }}-${{ hashFiles('src/clients/sentium-satelles/src-tauri/Cargo.lock', 'src/clients/sentium-satelles/src-tauri/rust-toolchain.toml') }}

      - name: Clippy
        working-directory: ./src/clients/sentium-satelles/src-tauri
        run: cargo clippy --locked -- -D warnings

      - name: Test
        working-directory: ./src/clients/sentium-satelles/src-tauri
        run: cargo test --locked

  satelles-deny:
    name: Sentium Satelles Supply Chain
    # cargo-deny checks the crate graph (all platforms) against RustSec advisories, licenses and allowed sources.
    needs: changes
    if: needs.changes.outputs.satelles == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ./src/clients/sentium-satelles/src-tauri/Cargo.toml
          command: check
          arguments: --locked

  react-build-test:
    name: React Build & Test
    needs: changes
    if: needs.changes.outputs.portal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./src/clients/sentium-portal
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: "./pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter sentium-portal

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Test with Coverage
        run: pnpm run test:coverage

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-coverage-report
          path: ./src/clients/sentium-portal/coverage
          retention-days: 7

  e2e:
    name: E2E Tests (Playwright)
    needs: [changes, dotnet-build-test, react-build-test]
    if: >-
      !cancelled() && !failure()
      && github.event_name != 'push'
      && needs.changes.outputs.e2e == 'true'
      && needs.changes.outputs.draft != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: "true"
      E2E_SKIP_BUILD: "1"
      BROWSER: ${{ github.event_name == 'workflow_dispatch' && inputs.browser || 'chromium' }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: "./pnpm-lock.yaml"

      - name: Install dependencies (portal + e2e)
        run: pnpm install --frozen-lockfile --filter sentium-portal --filter sentium-e2e

      - name: Build portal (into Sentium.Web/wwwroot)
        working-directory: ./src/clients/sentium-portal
        run: pnpm exec vite build

      - name: Build Sentium.Web
        run: dotnet build src/hosts/Sentium.Web/Sentium.Web.csproj -c Release

      - name: Typecheck E2E suite
        working-directory: ./e2e
        run: pnpm typecheck

      - name: Resolve Playwright version
        id: playwright-version
        working-directory: ./e2e
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.BROWSER }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers + OS deps
        working-directory: ./e2e
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          if [ "$BROWSER" = "all" ]; then pnpm exec playwright install --with-deps; else pnpm exec playwright install --with-deps "$BROWSER"; fi

      - name: Install Playwright OS deps (cache hit)
        working-directory: ./e2e
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          if [ "$BROWSER" = "all" ]; then pnpm exec playwright install-deps; else pnpm exec playwright install-deps "$BROWSER"; fi

      - name: Start backing services
        working-directory: ./e2e
        run: pnpm infra:up

      - name: Run Playwright E2E tests
        working-directory: ./e2e
        run: |
          if [ "$BROWSER" = "all" ]; then pnpm test; else pnpm test --project="$BROWSER"; fi

      - name: Dump backing service logs
        if: failure()
        working-directory: ./e2e
        run: pnpm infra:logs

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: ./e2e/playwright-report
          retention-days: 7

      - name: Upload Playwright test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: ./e2e/test-results
          retention-days: 7
