name: Sentium.E2E

on:
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "24"
  BUILD_CONFIGURATION: "Release"

jobs:
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      E2E_USER_NAME: ${{ secrets.E2E_USER_NAME }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      PLAYWRIGHT_BASE_URL: "http://localhost:5173"
      CI: "true"

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Create HTTPS dev certificate
        run: dotnet dev-certs https

      - name: Build .NET (Release)
        run: dotnet build --no-restore --configuration ${{ env.BUILD_CONFIGURATION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.0.6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: "./e2e/pnpm-lock.yaml"

      - name: Install E2E dependencies
        working-directory: ./e2e
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/pnpm-lock.yaml') }}

      - name: Install Playwright browsers + OS deps
        working-directory: ./e2e
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps

      - name: Install Playwright OS deps (cache hit)
        working-directory: ./e2e
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps

      - name: Run Playwright E2E tests
        working-directory: ./e2e
        run: pnpm test

      # Resource (Postgres, web, Vite ...) output only goes to the Aspire dashboard, so when the stack fails to
      # come up the only trace is in docker and in DCP's temp log files.
      - name: Dump Aspire diagnostics
        if: failure()
        run: |
          docker ps -a || true
          for c in $(docker ps -aq); do
            echo "::group::docker logs $(docker inspect -f '{{.Name}}' "$c")"
            docker logs --tail 100 "$c" 2>&1 || true
            echo "::endgroup::"
          done
          find /tmp -path '*aspire*' -type f -size +0 2>/dev/null | while read -r f; do
            echo "::group::$f"
            tail -n 100 "$f"
            echo "::endgroup::"
          done

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: ./e2e/playwright-report
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: ./e2e/test-results
          retention-days: 14
