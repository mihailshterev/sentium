name: Sentium.PR.Lint

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronized
      - reopened

permissions:
  pull-requests: read
  statuses: write

jobs:
  validate-title:
    name: Validate Conventional Commit PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Semantic PR Title Check
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

          requireScope: false

          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: "The subject line must not start with an uppercase letter."
