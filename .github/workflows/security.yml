name: Sentium.Security

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Dependency Review & Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Fails when the PR adds or upgrades to a dependency with a known moderate-or-worse advisory.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # glib 0.18 VariantStrIter unsoundness (RUSTSEC-2024-0429), pinned by Tauri's GTK3 stack and unreachable from our
          # graph; see the matching ignore in src/clients/sentium-satelles/src-tauri/deny.toml.
          allow-ghsas: GHSA-wrw7-89jp-8q8g

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: ${{ !cancelled() }}
        with:
          persist-credentials: false

      # Audits the workflows under .github/ for injection, credential leaks, over-broad permissions
      # and actions not pinned to a commit SHA. Reports as annotations rather than uploading SARIF, so it
      # also works on PRs from forks. Runs even when dependency review failed, so both results show.
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        if: ${{ !cancelled() }}
        with:
          version: 1.31.1
          advanced-security: false
