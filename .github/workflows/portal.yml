name: Sentium.Portal

on:
  push:
    branches: [main]
    paths: &paths
      - "src/clients/sentium-portal/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/portal.yml"
  pull_request:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: React Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./src/clients/sentium-portal
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "./pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter sentium-portal

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Test with Coverage
        run: pnpm run test:coverage

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-coverage-report
          path: ./src/clients/sentium-portal/coverage
          retention-days: 7
