name: Sentium.Satelles

on:
  push:
    branches: [main]
    paths: &paths
      - "src/clients/sentium-satelles/**"
      - ".github/workflows/satelles.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: satelles-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Sentium Satelles (${{ matrix.os }})
    if: github.event.pull_request.draft != true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["windows-latest","macos-latest","ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: ./src/clients/sentium-satelles/src-tauri
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev patchelf

      - name: Install Rust
        run: rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/clients/sentium-satelles/src-tauri/target
          key: satelles-${{ runner.os }}-${{ hashFiles('src/clients/sentium-satelles/src-tauri/Cargo.lock', 'src/clients/sentium-satelles/src-tauri/rust-toolchain.toml') }}

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  deny:
    name: Sentium Satelles Supply Chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ./src/clients/sentium-satelles/src-tauri/Cargo.toml
          command: check
          arguments: --locked
