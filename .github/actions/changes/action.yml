name: Detect changes
description: >-
  Classifies the files a pull request touches so expensive jobs can skip the areas it leaves alone.
  Outside pull_request events (push, schedule, workflow_dispatch), and on a PR that edits the gated
  workflows or this action, every area flag is "true" so those runs still cover everything.

outputs:
  dotnet:
    description: Anything the .NET solution (or the infra it tests against) depends on changed.
    value: ${{ steps.detect.outputs.dotnet }}
  portal:
    description: The portal or the root pnpm workspace changed.
    value: ${{ steps.detect.outputs.portal }}
  satelles:
    description: The Satelles desktop app changed.
    value: ${{ steps.detect.outputs.satelles }}
  e2e:
    description: Anything the Playwright suite exercises changed (.NET, portal or the suite itself).
    value: ${{ steps.detect.outputs.e2e }}
  js:
    description: JavaScript/TypeScript sources changed (portal, Satelles UI or the E2E suite).
    value: ${{ steps.detect.outputs.js }}
  workflows:
    description: Anything under .github changed.
    value: ${{ steps.detect.outputs.workflows }}
  draft:
    description: The pull request is a draft.
    value: ${{ steps.detect.outputs.draft }}

runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT_NAME: ${{ github.event_name }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        DRAFT: ${{ github.event.pull_request.draft == true }}
      run: |
        set -euo pipefail
        emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
        all() { for flag in dotnet portal satelles e2e js workflows; do emit "$flag" true; done; }

        if [ "$EVENT_NAME" != "pull_request" ]; then
          emit draft false
          all
          exit 0
        fi
        emit draft "$DRAFT"

        files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)')
        count=$(grep -c . <<<"$files" || true)
        # The files API stops at 3000 entries, so a PR that large is treated as touching everything.
        if [ "$count" -ge 3000 ] || grep -Eq '^\.github/(workflows/(ci|codeql|docker)\.yml|actions/)' <<<"$files"; then
          all
          exit 0
        fi

        has() { if grep -Eq "$1" <<<"$files"; then echo true; else echo false; fi; }
        has_other_than() { if grep -Evq "$1" <<<"$files"; then echo true; else echo false; fi; }
        either() { if [ "$1" = true ] || [ "$2" = true ] || [ "$3" = true ]; then echo true; else echo false; fi; }

        # .NET is the conservative default: any file outside the clients, the E2E suite, the JS workspace
        # root and docs/tooling counts (infra, compose, props, tests, ...).
        dotnet=$(has_other_than '^(src/clients/|e2e/|\.github/|\.claude/|\.vscode/|docs/|scripts/)|\.md$|^(LICENSE|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.npmrc|\.gitignore)$')
        portal=$(has '^(src/clients/sentium-portal/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.npmrc$)')
        satelles=$(has '^src/clients/sentium-satelles/')
        suite=$(has '^e2e/')

        emit dotnet "$dotnet"
        emit portal "$portal"
        emit satelles "$satelles"
        emit e2e "$(either "$dotnet" "$portal" "$suite")"
        emit js "$(either "$portal" "$(has '^src/clients/sentium-satelles/ui/')" "$suite")"
        emit workflows "$(has '^\.github/')"
