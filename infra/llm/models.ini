version = 1

; Chat model presets for llama-server in router mode.
; - The section name is the model id clients send (Inference:DefaultModel, agent and Registry models).
; - Keys are llama-server arguments without the leading dashes.
; - Only models declared here are served: the router is started without --models-dir, so stray files
;   in the models volume (such as the embedding model, served separately) are never exposed.
; - Model files are fetched and checksum-verified from models.lock by fetch-models.sh.
; GPU layers are fitted to free device memory automatically (--fit is on by default).

[*]
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
jinja = true

[gemma-4-e4b]
model = /models/gemma-4-E4B-it-Q4_0.gguf
; 2 parallel slots x 16k tokens each.
ctx-size = 32768
parallel = 2
load-on-startup = true
